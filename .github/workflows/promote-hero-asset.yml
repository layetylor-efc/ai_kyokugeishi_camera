name: Promote AI Kyokugeishi camera asset

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-hero-asset.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use repository image asset in landing page
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          asset = 'assets/ai-kyokugeishi-camera.webp'

          # Replace embedded camera images (header / hero / footer) with the
          # repository asset so GitHub Pages serves one stable, cacheable file.
          s2, n = re.subn(
              r'src="data:image/(?:jpeg|jpg|png|webp);base64,[A-Za-z0-9+/=]+"',
              f'src="{asset}"',
              s,
          )
          if n < 1 and asset not in s:
              raise SystemExit('No embedded camera image found to replace')

          # Ensure stable mobile rendering and avoid the empty hero-card height
          # seen on Android when an embedded image fails to resolve.
          patch = '''\n/* repository hero asset QA 2026-09-08 */\n.brand-badge img{width:100%;height:100%;object-fit:cover}\n.appcard img{display:block;width:100%;height:auto;aspect-ratio:1/1;object-fit:cover}\n@media(max-width:560px){.hero-art{width:100%;margin-top:12px}.appcard{min-height:0!important;transform:none!important}.appcard img{width:100%!important;height:auto!important}}\n'''
          if 'repository hero asset QA 2026-09-08' not in s2:
              s2 = s2.replace('</style>', patch + '</style>', 1)

          p.write_text(s2, encoding='utf-8')
          print(f'replaced embedded images: {n}')
          PY
      - name: Validate asset and HTML
        run: |
          test -s assets/ai-kyokugeishi-camera.webp
          grep -q 'assets/ai-kyokugeishi-camera.webp' index.html
          grep -q '<!DOCTYPE html>' index.html
      - name: Commit landing page asset migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "fix: serve AI Kyokugeishi hero from repository asset"
            git push
          fi
